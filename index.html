<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Are An Idiot</title>
    <style>
        body {
            background-color: white;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: pointer;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #start-prompt {
            font-size: 2.5rem;
            font-weight: bold;
            border: 4px dashed #000;
            padding: 20px;
            text-align: center;
        }
        /* Container for the real Wayback animation */
        #video-wrapper {
            width: 100%;
            height: 100%;
            display: none; /* Hidden until clicked */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="start-prompt">CLICK ANYWHERE TO START</div>
    
    <div id="video-wrapper">
        <!-- Notice the 'id_' added right after the timestamp digits. This makes the iframe load natively -->
        <iframe id="payload-frame" src=""></iframe>
    </div>

    <script>
        let isStarted = false;
        let trackedWindows = [];
        
        // The exact isolated Wayback stream URL 
        const waybackUrl = "https://archive.org";

        function spawnWindow() {
            const screenW = window.screen.availWidth;
            const screenH = window.screen.availHeight;
            let w = 420;
            let h = 330;
            let x = Math.random() * (screenW - w); 
            let y = Math.random() * (screenH - h);
            
            let dx = (Math.random() > 0.5 ? 7 : -7);
            let dy = (Math.random() > 0.5 ? 7 : -7);

            let win = window.open("", "_blank", `width=${w},height=${h},left=${x},top=${y},toolbar=no,menubar=no`);
            if (!win) return; // Popups blocked

            win.document.write(`
                <html>
                <body style="margin:0; overflow:hidden; background:white;">
                    <iframe src="${waybackUrl}" style="width:100%; height:100%; border:none;"></iframe>
                </body>
                </html>
            `);
            win.document.close();

            trackedWindows.push({ ref: win, wasClosed: false });

            let moveInterval = setInterval(() => {
                if (win.closed) {
                    clearInterval(moveInterval);
                    return;
                }
                x += dx; y += dy;
                if (x <= 0 || x >= (screenW - w)) dx = -dx;
                if (y <= 0 || y >= (screenH - h)) dy = -dy;
                win.moveTo(x, y);
            }, 16);
        }

        // Monitoring system loop
        setInterval(() => {
            if (!isStarted) return;
            for (let i = 0; i < trackedWindows.length; i++) {
                let winObj = trackedWindows[i];
                if (winObj.ref.closed && !winObj.wasClosed) {
                    winObj.wasClosed = true; 
                    spawnWindow();
                    spawnWindow();
                }
            }
        }, 100);

        // Click to deploy
        document.body.addEventListener('click', () => {
            if (isStarted) return;
            isStarted = true;
            
            document.getElementById('start-prompt').style.display = 'none';
            document.getElementById('video-wrapper').style.display = 'block';
            
            // Set the frame source on user gesture to fulfill browser audio rules
            document.getElementById('payload-frame').src = waybackUrl;
            
            for(let i = 0; i < 3; i++) {
                setTimeout(spawnWindow, i * 150);
            }
        });
    </script>
</body>
</html>
